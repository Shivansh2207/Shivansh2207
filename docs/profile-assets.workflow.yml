# Ready-to-install template. Place at .github/workflows/profile-assets.yml
# after authorizing GitHub workflow uploads. It is not active in docs/.
name: Refresh profile artwork

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-art.mjs'
      - 'scripts/refresh-activity.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/profile-assets.yml'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:art
      - run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save refreshed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets
          if git diff --cached --quiet; then
            echo 'Artwork is already current.'
            exit 0
          fi
          git commit -m 'Refresh GitHub activity artwork [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
