<svg xmlns="http://www.w3.org/2000/svg" width="600" height="666" viewBox="0 0 600 666" role="img" aria-label="Shivansh Vyas | Software with a pulse" font-family="Arial,Helvetica,sans-serif">
<title>Shivansh Vyas | Software with a pulse</title>
<style>.heavy{font-weight:900;letter-spacing:-5px}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 32s linear infinite}.reverse{animation-direction:reverse;animation-duration:45s}.breathe{animation:breathe 4s ease-in-out infinite}.cursor{animation:cursor 1.3s steps(1) infinite}.flow{stroke-dasharray:6 12;animation:flow 4s linear infinite}.float{animation:float 7s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.35}}@keyframes cursor{50%{opacity:0}}@keyframes flow{to{stroke-dashoffset:-72}}@keyframes float{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){.orbit,.breathe,.cursor,.flow,.float{animation:none!important}}</style>
<rect x="1" y="1" width="598" height="664" rx="24" fill="#090c12" stroke="#26303e"/>
<text x="30" y="45" fill="#c8ff62" font-size="17" font-family="Consolas, 'Liberation Mono', monospace" >SV / SOFTWARE WITH A PULSE</text><path d="M30 70H570" stroke="#26303e"/>
<text x="30" y="110" fill="#a1aaba" font-size="17" font-family="Consolas, 'Liberation Mono', monospace" >WEB / MOBILE / FULL STACK</text>
<text x="24" y="198" fill="#f2f5ec" font-size="79" class="heavy">SHIVANSH</text><text x="24" y="291" fill="#c8ff62" font-size="103" class="heavy">VYAS</text><rect class="cursor" x="319" y="280" width="45" height="10" fill="#c8ff62"/>
<text x="30" y="346" fill="#f2f5ec" font-size="27" font-weight="600">Ideas into interfaces.</text><text x="30" y="384" fill="#a1aaba" font-size="27" >Interfaces into real things.</text>
<g transform="translate(450 490)"><g class="orbit"><circle r="79" fill="none" stroke="#a899ff" stroke-width="2" stroke-dasharray="45 12"/><ellipse rx="80" ry="32" fill="none" stroke="#c8ff62" transform="rotate(-30)"/></g><text x="0" y="12" fill="#f2f5ec" font-size="34" font-weight="800" text-anchor="middle">SV</text></g>
<text x="30" y="470" fill="#f2f5ec" font-size="18" font-family="Consolas, 'Liberation Mono', monospace" >DEVELOPER.</text><text x="30" y="502" fill="#f2f5ec" font-size="18" font-family="Consolas, 'Liberation Mono', monospace" >BUILDER.</text><text x="30" y="534" fill="#c8ff62" font-size="18" font-family="Consolas, 'Liberation Mono', monospace" >PERPETUALLY CURIOUS.</text>
<path d="M30 587H570" stroke="#26303e"/><text x="30" y="630" fill="#f2f5ec" font-size="21" font-family="Consolas, 'Liberation Mono', monospace" >$ ship --web --mobile</text><rect class="cursor" x="302" y="612" width="11" height="23" fill="#c8ff62"/></svg>
